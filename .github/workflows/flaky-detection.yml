name: Critical-path stability

on:
  schedule:
    - cron: '30 2 * * 6'
  workflow_dispatch:

jobs:
  repeat-critical-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24.9.0
          cache: npm
      - run: npm ci
      - run: npm --prefix application-under-test ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:flaky
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stability-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30
